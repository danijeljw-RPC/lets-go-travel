name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MSG=$(git log -1 --pretty=%B HEAD^2 2>/dev/null || git log -1 --pretty=%B)
          else
            MSG=$(git log -1 --pretty=%B)
          fi
          echo "Latest commit message: $MSG"
          if [[ "$MSG" == skip-wf* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_DB: rtgt
          POSTGRES_USER: rtgt
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=rtgt --dbname=rtgt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore ReadyToGoTravel.slnx --locked-mode
      - name: Verify formatting
        run: dotnet format ReadyToGoTravel.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build ReadyToGoTravel.slnx --configuration Release --no-restore
      - name: Verify consumer migration against PostgreSQL
        env:
          RTGT_CI_CONNECTION: Host=localhost;Port=5432;Database=rtgt;Username=rtgt;Password=ci-only-not-a-production-secret
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef database update \
            --project src/ReadyToGoTravel.Consumer/ReadyToGoTravel.Consumer.csproj \
            --connection "$RTGT_CI_CONNECTION"
          dotnet tool run dotnet-ef migrations script --idempotent \
            --project src/ReadyToGoTravel.Consumer/ReadyToGoTravel.Consumer.csproj \
            --output "$RUNNER_TEMP/consumer-migration.sql"
      - name: Test
        run: dotnet test ReadyToGoTravel.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
      - name: Validate documentation
        run: ./scripts/validate-docs.sh
      - name: Build API image
        run: docker build --file src/ReadyToGoTravel.Api/Dockerfile --tag rtgt-api:ci .
      - name: Build web image
        run: docker build --file src/ReadyToGoTravel.Web/Dockerfile --tag rtgt-web:ci .
      - name: Build general worker image
        run: docker build --file src/ReadyToGoTravel.Worker/Dockerfile --tag rtgt-worker:ci .
      - name: Build flight reconciliation image
        run: docker build --file src/ReadyToGoTravel.FlightReconciliation.Worker/Dockerfile --tag rtgt-flight-worker:ci .
