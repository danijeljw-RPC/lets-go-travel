name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore ReadyToGoTravel.slnx --locked-mode
      - name: Verify formatting
        run: dotnet format ReadyToGoTravel.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build ReadyToGoTravel.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test ReadyToGoTravel.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
      - name: Validate documentation
        run: ./scripts/validate-docs.sh
      - name: Build API image
        run: docker build --file src/ReadyToGoTravel.Api/Dockerfile --tag rtgt-api:ci .
      - name: Build web image
        run: docker build --file src/ReadyToGoTravel.Web/Dockerfile --tag rtgt-web:ci .
      - name: Build general worker image
        run: docker build --file src/ReadyToGoTravel.Worker/Dockerfile --tag rtgt-worker:ci .
      - name: Build flight reconciliation image
        run: docker build --file src/ReadyToGoTravel.FlightReconciliation.Worker/Dockerfile --tag rtgt-flight-worker:ci .
